# Build prebuilt specticus binaries and attach them to a GitHub Release (#120).
#
# Triggers:
#   - Push of tag matching v* (e.g. v0.1.0) → package + attach to Release
#   - workflow_dispatch → package only (workflow artifacts; no Release upload)
#
# See docs/binaries.md and scripts/package-release.sh.

name: Release binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-binaries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-macos:
    name: package (macos-arm64)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Toolchain
        run: |
          swift --version
          uname -m

      - name: Package release tarball
        run: |
          chmod +x scripts/package-release.sh
          scripts/package-release.sh macos-arm64

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: specticus-macos-arm64
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  package-linux-x86_64:
    name: package (linux-x86_64)
    runs-on: ubuntu-24.04
    container:
      image: swift:6.2
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Toolchain
        run: |
          swift --version
          uname -m

      - name: Package release tarball
        run: |
          chmod +x scripts/package-release.sh
          scripts/package-release.sh linux-x86_64

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: specticus-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  # Best-effort: arm runners / minutes may be unavailable on some plans.
  package-linux-arm64:
    name: package (linux-arm64)
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    container:
      image: swift:6.2
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Toolchain
        run: |
          swift --version
          uname -m

      - name: Package release tarball
        run: |
          chmod +x scripts/package-release.sh
          scripts/package-release.sh linux-arm64

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: specticus-linux-arm64
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    name: publish GitHub Release assets
    needs: [package-macos, package-linux-x86_64, package-linux-arm64]
    runs-on: ubuntu-24.04
    # Publish when required jobs succeeded; arm64 may have been skipped/failed.
    if: >
      always() &&
      !cancelled() &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.package-macos.result == 'success' &&
      needs.package-linux-x86_64.result == 'success'
    steps:
      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
          pattern: specticus-*

      - name: List assets
        run: find artifacts -type f | sort

      - name: Attach assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.sha256
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
