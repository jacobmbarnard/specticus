name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  build-and-test:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Package.swift requires Swift tools 6.3+. Prefer the Xcode already on the
      # runner over swift-actions/setup-swift@v2 (no 6.3 support; Node 20).
      - name: Select Xcode (Swift 6.3+)
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test
