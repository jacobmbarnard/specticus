# Specticus configuration
# Generated by `scs init --style minimal`
# Loaded by build, clean, and lint. CLI flags override these values.

version: 1

project:
  title: "{{PROJECT_NAME}}"

# Documentation style pack (#141). Built-in: default, minimal.
# Missing style ⇒ default.
doc:
  style: "{{DOC_STYLE}}"

build:
  default_input: "welcome-template.md"
  output: "output/index.html"
  css: "style.css"
  copy_assets: true
  diagrams_enabled: true
  diagrams_dir: "diagrams"
  track_builds: true
  heading_number_max_level: 3
  toc: true
  toc_max_level: 3

decision_records:
  adrs_enabled: true
  bdrs_enabled: false

ids:
  auto_assign: false
  heading_max_level: 2
  drift_sensitivity: strict
