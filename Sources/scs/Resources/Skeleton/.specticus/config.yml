# Specticus configuration
# Generated by `scs init`
# Loaded by build, clean, and lint. CLI flags override these values.
# See https://github.com/jacobmbarnard/specticus/issues/7 and #9

version: 1

project:
  title: "{{PROJECT_NAME}}"
  # author: "Your Name"

build:
  # Used only when no numbered *.md sections are found (legacy single-file mode)
  default_input: "welcome-template.md"
  # Structured output: HTML + css/ + img/ + svg/ under the same directory (#9)
  output: "output/index.html"
  css: "style.css"
  copy_assets: true
  diagrams_enabled: true
  diagrams_dir: "diagrams"
  # Mermaid diagrams can be embedded in Markdown or kept under diagrams_dir
  # Increment .specticus/build-number.yml and stamp the HTML footer on each build (#8)
  track_builds: true
  # Hierarchical section numbers through this ATX heading level (default 3, max 6; 0 = off).
  # Independent of traceability IDs (BR-*, TS-*, …) — see issues #4 and #6.
  heading_number_max_level: 3
  # Hyperlinked table of contents (#12); levels 1…toc_max_level get anchors + TOC links.
  toc: true
  toc_max_level: 3

decision_records:
  adrs_enabled: true
  bdrs_enabled: true

ids:
  # auto_assign safety (#38) — READ BEFORE ENABLING
  # When true, `scs build` only REPORTS pending ID assignments (dry-run).
  # It does NOT rewrite Markdown sources by itself.
  # To actually assign during build you must pass an explicit flag:
  #   scs build --assign-ids
  # That flag REWRITES Markdown in place — avoid in CI / shared checkouts unless intentional.
  # Safer workflow (recommended):
  #   scs ids assign --dry-run
  #   scs ids assign --yes
  # Default false keeps build purely generative (HTML/assets only).
  # IDs use simple form BR1 / TS2 / ADR3 (no dash, no zero-padding). Must be unique.
  # Drift detection and warnings apply in ids assign, lint, and build (#6).
  auto_assign: false
  # ATX heading levels 1…heading_max_level may own traceability IDs (#32).
  # Default 2 = H1 and H2 only. Raise to 3…6 to include deeper headings (e.g. nested test cases).
  # Independent of build.heading_number_max_level (#4) and toc_max_level (#12).
  heading_max_level: 2
  # Counter policy (#33): new IDs always use (per-prefix max) + 1. Numbers are never reused.
  # Gaps after deleted requirements are intentional; orphaned entries in ids.json still reserve
  # their numbers for traceability. There is no gap-fill or renumber mode.
  # Drift sensitivity (#36) when comparing heading text to ids.json bindings:
  #   strict (default)     — any character change is drift
  #   contentStrict        — allow case changes; whitespace may grow/shrink (not disappear)
  #   contentStrictPlus    — same as contentStrict, plus ignore punctuation changes
  # Snake_case aliases content_strict / content_strict_plus also accepted.
  # Markdown formatting in headings (**bold**, *italic*, `code`, links, HTML) is never allowed.
  drift_sensitivity: strict

# Assembly layout (#140) — optional overrides (pack defaults live in layout.yml).
# Reorder verticals or change per-section file sort:
# assembly:
#   sections:
#     - id: appendices
#       order: 900
#       sort: alphanumeric
#     - id: technical-specifications
#       order: 10
#       sort: reverse_lexical
