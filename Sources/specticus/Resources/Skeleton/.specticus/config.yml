# Specticus configuration
# Generated by `specticus init`
# See https://github.com/jacobmbarnard/specticus/issues/7 for details

version: 1
project:
  title: "{{PROJECT_NAME}}"
  # add author, etc as needed

build:
  default_input: "welcome-template.md"
  output: "output.html"
  diagrams_enabled: true
  # diagram format geared toward Mermaid (.mmd files)
  # Mermaid diagrams can be embedded directly in Markdown or rendered externally

ids:
  auto_assign: false

# Future: source paths, css override, etc.
