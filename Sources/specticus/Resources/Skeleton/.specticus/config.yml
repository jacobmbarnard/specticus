# Specticus configuration
# Generated by `specticus init`
# Loaded by build, clean, and lint. CLI flags override these values.
# See https://github.com/jacobmbarnard/specticus/issues/7 and #9

version: 1

project:
  title: "{{PROJECT_NAME}}"
  # author: "Your Name"

build:
  # Used only when no numbered *.md sections are found (legacy single-file mode)
  default_input: "welcome-template.md"
  # Structured output: HTML + css/ + img/ + svg/ under the same directory (#9)
  output: "output/index.html"
  css: "style.css"
  copy_assets: true
  diagrams_enabled: true
  diagrams_dir: "diagrams"
  # Mermaid diagrams can be embedded in Markdown or kept under diagrams_dir
  # Increment .specticus/build-number.yml and stamp the HTML footer on each build (#8)
  track_builds: true
  # Hierarchical section numbers through this ATX heading level (default 3, max 6; 0 = off).
  # Independent of traceability IDs (BR-*, TS-*, …) — see issues #4 and #6.
  heading_number_max_level: 3

decision_records:
  adrs_enabled: true
  bdrs_enabled: true

ids:
  # When true, future builds may auto-assign missing traceability IDs (#6)
  auto_assign: false
